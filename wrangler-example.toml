name = "pua-bot"
workers_dev = true
compatibility_date = "2024-11-11"
compatibility_flags = ["nodejs_compat_v2"]

main = "./packages/apps/workers/src/index.ts"

kv_namespaces = [
  { binding = "DATABASE", id = "", preview_id = "" }
]

[vars]
# Telegram
TELEGRAM_AVAILABLE_TOKENS = "123456:telegram-token"
# Set to "all" to allow everyone, or comma-separated chat IDs to restrict access.
CHAT_WHITE_LIST = "all"
# Empty means group chats are disabled. Use comma-separated group chat IDs to enable groups.
CHAT_GROUP_WHITE_LIST = ""
LANGUAGE = "zh-cn"
MAX_HISTORY_LENGTH = "20"
SHOW_REPLY_BUTTON = "false"

# Scripts
SCRIPT_ENABLE = "true"
SCRIPT_ADMIN_IDS = "123456789"

# Model: OpenAI-compatible.
AI_PROVIDER = "openai"
OPENAI_CHAT_MODEL = "gpt-4o-mini"
OPENAI_API_BASE = "https://api.openai.com/v1"
# Store real keys as secrets:
# pnpm wrangler secret put OPENAI_API_KEY

# Model: Claude.
# AI_PROVIDER = "claude"
# CLAUDE_CHAT_MODEL = "claude-3-5-haiku-latest"
# CLAUDE_API_BASE = "https://api.anthropic.com/v1"
# pnpm wrangler secret put CLAUDE_API_KEY
