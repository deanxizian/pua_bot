name = "pua-bot"
workers_dev = true
compatibility_date = "2024-11-11"
compatibility_flags = ["nodejs_compat_v2"]

main = "./packages/apps/workers/src/index.ts"

kv_namespaces = [
  { binding = "DATABASE", id = "", preview_id = "" }
]

[vars]
# Telegram
TELEGRAM_AVAILABLE_TOKENS = "123456:telegram-token"
CHAT_WHITE_LIST = "telegram-chat-id"

# Script-first mode
SCRIPT_ENABLE = "true"
SCRIPT_ADMIN_IDS = "123456789"
SCRIPT_ONLY_MODE = "false"
SCRIPT_MARKDOWN_KEY = "scripts:markdown"
SCRIPT_FALLBACK_ID = "fallback"
SCRIPT_DEFAULT_FALLBACK_TEXT = "这个问题我暂时还不能准确回答，我可以帮你转人工进一步确认。"
SCRIPT_CACHE_TTL_SECONDS = "30"

# Model example: OpenAI-compatible
# AI_PROVIDER = "openai"
# OPENAI_API_KEY = "sk-..."
# OPENAI_CHAT_MODEL = "gpt-4o-mini"
# OPENAI_API_BASE = "https://api.openai.com/v1"
